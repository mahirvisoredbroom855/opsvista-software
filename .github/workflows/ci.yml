name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements-test.txt

      - name: Run pytest
        env:
          USE_MOCK_EMBEDDINGS: "true"
        run: pytest -v

      - name: Smoke-import the FastAPI app
        # pytest never imports app.main (tests target chat.py's helpers
        # directly), so a missing dependency used only there — e.g. slowapi —
        # can pass CI and still crash the real server on boot. This mirrors
        # exactly what `uvicorn app.main:app` does at process start.
        env:
          USE_MOCK_EMBEDDINGS: "true"
        run: python -c "import app.main"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Mocha)
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_REQUIRE_AUTH: "false"
        run: npm run build
