# This file runs automatically on every push and pull request: it
# installs the backend and frontend, runs all the automated tests,
# checks code style, and makes sure the frontend actually builds. If
# any of that fails, GitHub shows a red X on the commit/PR so a broken
# change never quietly slips through.
#
# [OPS:CI-002] What it does: runs on every push to the listed branches and
# every pull request — backend tests (pytest) plus a smoke-import of the
# real app, and frontend lint + unit tests + build. The branches list has
# to name every branch that should trigger this; feat/rag-chatbot was
# added here after CI silently never ran on it for a while.
name: CI

on:
  push:
    branches: [main, master, feat/rag-chatbot]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements-test.txt

      - name: Run pytest
        env:
          USE_MOCK_EMBEDDINGS: "true"
        run: pytest -v

      - name: Smoke-import the FastAPI app
        # [OPS:CI-002b] What it does: actually imports app.main, the same
        # way the real server does at startup. The pytest step above never
        # touches app.main directly (it tests chat.py's helpers in
        # isolation), so a missing dependency that only main.py needs —
        # like slowapi — could pass every test and still crash the real
        # server on boot. This step catches that.
        env:
          USE_MOCK_EMBEDDINGS: "true"
        run: python -c "import app.main"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Mocha)
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_REQUIRE_AUTH: "false"
        run: npm run build
