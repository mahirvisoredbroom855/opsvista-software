name: Scheduled Reindex

# This is the robot that keeps OpsVista's knowledge base fresh without
# anyone lifting a finger. Every night, it calls the backend and says
# "go rescan Google Drive and rebuild the search index" — using a
# secret key instead of a human login, since nobody's around at 3am to
# click a button.
#
# ─────────────────────────────────────────────────────────────────────────
# MODULE: [OPS:CI-001]
#
# What it does: calls the backend's reindex endpoint once a day, using a
# secret token instead of a human login. Every run does a full rescan of
# Google Drive from scratch, not an incremental update — running nightly
# is a deliberate tradeoff between freshness and cost, not a limitation.
# Can also be triggered manually anytime from the Actions tab if fresher
# data is needed sooner.
# ─────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      # [OPS:CI-001a] What it does: sends the POST request that starts a
      # reindex. A 200 (started) or a 409 (one's already running — treated
      # as success, same as the dashboard button's behavior) both count as
      # fine; anything else fails this job.
      - name: Trigger reindex
        id: trigger
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/api/rag/admin/reindex" \
            -H "X-Automation-Token: ${{ secrets.REINDEX_AUTOMATION_TOKEN }}")
          cat response.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "409" ]; then
            echo "Unexpected status code: $http_code"
            exit 1
          fi

      # [OPS:CI-001b] What it does: checks the reindex status every 15
      # seconds, up to 60 times (a 15-minute ceiling), and stops early once
      # the status becomes "completed" or "failed". The whole job fails if
      # it's not "completed" once polling stops.
      - name: Poll until the background reindex finishes
        run: |
          status="running"
          for i in $(seq 1 60); do
            sleep 15
            body=$(curl -s "${{ secrets.BACKEND_URL }}/api/rag/admin/reindex/status" \
              -H "X-Automation-Token: ${{ secrets.REINDEX_AUTOMATION_TOKEN }}")
            status=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','unknown'))")
            echo "[$i] status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ]; then
              echo "$body"
              break
            fi
          done

          if [ "$status" != "completed" ]; then
            echo "Reindex did not complete successfully (final status: $status)"
            exit 1
          fi
