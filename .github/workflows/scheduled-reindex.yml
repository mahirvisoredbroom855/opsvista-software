name: Scheduled Reindex

# This is the robot that keeps OpsVista's knowledge base fresh without
# anyone lifting a finger. Every night, it calls the backend and says
# "go rescan Google Drive and rebuild the search index" — using a
# secret key instead of a human login, since nobody's around at 3am to
# click a button.
#
# ═══════════════════════════════════════════════════════════════════════
# MODULE: [OPS:CI-001] — the daily automated reindex trigger
#
# Keeps the knowledge base current without anyone remembering to click a
# button. discover_documents() ([OPS:ING-002a], backend/build_drive_index.py)
# does a full Drive rescan each run — no incremental diffing — so a nightly
# cadence is a deliberate cost/freshness tradeoff, not a limitation of this
# workflow. Trigger a run manually anytime from the Actions tab
# (workflow_dispatch) if you need fresher data sooner than the schedule.
# Calls [OPS:ADMIN-001b]/[OPS:ADMIN-001c] over HTTP, authenticated via the
# X-Automation-Token header path in [OPS:AUTH-005]
# require_roles_or_automation_token() — this is the one real caller that
# needs that headless-auth escape hatch to exist at all.
# ═══════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      # [OPS:CI-001a] POST /api/rag/admin/reindex [OPS:ADMIN-001b]. A 200
      # (started) or 409 (already running — treated as success, matches the
      # dashboard's ReindexButton [OPS:FE-DASH-a] behavior) are both fine;
      # anything else fails the job.
      - name: Trigger reindex
        id: trigger
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/api/rag/admin/reindex" \
            -H "X-Automation-Token: ${{ secrets.REINDEX_AUTOMATION_TOKEN }}")
          cat response.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "409" ]; then
            echo "Unexpected status code: $http_code"
            exit 1
          fi

      # [OPS:CI-001b] polls GET /reindex/status [OPS:ADMIN-001c] every 15s,
      # up to 60 times (15 min ceiling) — same status endpoint the
      # dashboard's ReindexButton [OPS:FE-DASH-a] polls, just with a fixed
      # interval here instead of self-rescheduling JS. Job fails (exit 1)
      # if the final status isn't "completed" when polling stops.
      - name: Poll until the background reindex finishes
        run: |
          status="running"
          for i in $(seq 1 60); do
            sleep 15
            body=$(curl -s "${{ secrets.BACKEND_URL }}/api/rag/admin/reindex/status" \
              -H "X-Automation-Token: ${{ secrets.REINDEX_AUTOMATION_TOKEN }}")
            status=$(echo "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','unknown'))")
            echo "[$i] status=$status"
            if [ "$status" = "completed" ] || [ "$status" = "failed" ]; then
              echo "$body"
              break
            fi
          done

          if [ "$status" != "completed" ]; then
            echo "Reindex did not complete successfully (final status: $status)"
            exit 1
          fi
